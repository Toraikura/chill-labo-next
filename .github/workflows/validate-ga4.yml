name: Validate GA4 branch

on:
  push:
    branches: ["setup-ga4-20261002"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production bundle and run static checks
        run: |
          npm run build:production
          npm run check
          npm run package
