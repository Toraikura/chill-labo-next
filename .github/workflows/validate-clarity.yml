name: Validate Clarity production tag

on:
  push:
    branches: ["enable-clarity-ys8l0f6sqd"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production bundle and verify Clarity
        env:
          SITE_ORIGIN: https://chilllabo.tokyo
          SITE_INDEXABLE: 'true'
        run: |
          npm run build
          npm run check
          npm run package
          grep -F 'https://www.clarity.ms/tag/' index.html >/dev/null
          grep -F 'ys8l0f6sqd' index.html >/dev/null
