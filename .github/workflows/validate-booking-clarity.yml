name: Validate booking links and Clarity support

on:
  push:
    branches: ["booking-links-clarity-20261004"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production bundle and run checks
        env:
          SITE_ORIGIN: https://chilllabo.tokyo
          SITE_INDEXABLE: 'true'
          CLARITY_PROJECT_ID: testclarity123
        run: |
          npm run build
          npm run check
          npm run package
          grep -F 'https://www.clarity.ms/tag/' index.html >/dev/null
          grep -F '食べログで予約' index.html >/dev/null
          grep -F 'TableCheckで予約' index.html >/dev/null
