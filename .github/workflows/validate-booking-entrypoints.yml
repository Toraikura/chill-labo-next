name: Validate booking options all entrypoints

on:
  push:
    branches: ["booking-options-all-entrypoints-20261004"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production bundle and validate booking UI
        env:
          SITE_ORIGIN: https://chilllabo.tokyo
          SITE_INDEXABLE: 'true'
        run: |
          npm run build
          npm run check
          npm run package
          grep -F 'booking-chooser' index.html >/dev/null
          grep -F 'tablecheck_outbound' index.html >/dev/null
          grep -F 'tabelog_outbound' index.html >/dev/null
          grep -F '予約する' index.html >/dev/null
          test "$(grep -o 'tablecheck_outbound' index.html | wc -l | tr -d ' ')" -ge 5
          test "$(grep -o 'tabelog_outbound' index.html | wc -l | tr -d ' ')" -ge 5
          grep -F "window.clarity('event'" assets/js/site.js >/dev/null
