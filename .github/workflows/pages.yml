name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and check Japanese and English pages
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://toraikura.github.io/chill-labo-next' }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID || '' }}
        run: |
          npm run build
          npm run check
          npm run package

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production URLs through Cloudflare
        if: ${{ vars.SITE_ORIGIN == 'https://chilllabo.tokyo' }}
        run: |
          set -euo pipefail

          check_page() {
            url="$1"
            marker="$2"
            tmp="$(mktemp)"
            code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output "$tmp" --write-out '%{http_code}' "$url")"
            test "$code" = "200"
            grep -F "$marker" "$tmp" >/dev/null
            grep -F "G-GL74MVB738" "$tmp" >/dev/null
            rm -f "$tmp"
          }

          check_page "https://chilllabo.tokyo/" "ひと口ずつ"
          check_page "https://chilllabo.tokyo/en/" "One sip at a time"
          check_page "https://chilllabo.tokyo/story/" "好きな一本を"
          check_page "https://chilllabo.tokyo/guide/sake-karakuchi/" "日本酒の「辛口」"

          sitemap="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors https://chilllabo.tokyo/sitemap.xml)"
          printf '%s' "$sitemap" | grep -F '<loc>https://chilllabo.tokyo/story/</loc>' >/dev/null
          printf '%s' "$sitemap" | grep -F '<loc>https://chilllabo.tokyo/guide/sake-karakuchi/</loc>' >/dev/null

      - name: Verify public asset fingerprints
        if: ${{ vars.SITE_ORIGIN == 'https://chilllabo.tokyo' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { setTimeout as delay } from 'node:timers/promises';
          const origin = 'https://chilllabo.tokyo';
          const manifest = JSON.parse(await readFile('_site/assets/asset-manifest.json', 'utf8'));
          async function verify() {
            for (const route of ['/', '/en/', '/story/', '/guide/sake-karakuchi/']) {
              const response = await fetch(origin + route, { signal: AbortSignal.timeout(15000) });
              assert.equal(response.status, 200, route);
              const html = await response.text();
              for (const asset of Object.values(manifest)) assert(html.includes(asset), `${route}: old asset reference ${asset}`);
            }
            for (const asset of Object.values(manifest)) {
              const response = await fetch(`${origin}/${asset}`, { signal: AbortSignal.timeout(15000) });
              assert.equal(response.status, 200, asset);
              const actual = Buffer.from(await response.arrayBuffer());
              const expected = await readFile(`_site/${asset}`);
              assert(actual.equals(expected), `${asset}: published bytes differ from build`);
              console.log(`Verified ${asset}: ${createHash('sha256').update(actual).digest('hex')}`);
            }
          }
          for (let attempt = 0; ; attempt++) {
            try { await verify(); break; }
            catch (error) {
              if (attempt >= 9) throw error;
              console.log(`Waiting for public deployment propagation: ${error.message}`);
              await delay(4000);
            }
          }
          NODE
