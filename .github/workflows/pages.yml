name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and check Japanese and English pages
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://toraikura.github.io/chill-labo-next' }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID || '' }}
        run: |
          npm run build
          npm run check
          npm run package

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production URLs through Cloudflare
        if: ${{ vars.SITE_ORIGIN == 'https://chilllabo.tokyo' }}
        run: |
          set -euo pipefail

          check_page() {
            url="$1"
            marker="$2"
            tmp="$(mktemp)"
            code="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output "$tmp" --write-out '%{http_code}' "$url")"
            test "$code" = "200"
            grep -F "$marker" "$tmp" >/dev/null
            grep -F "G-GL74MVB738" "$tmp" >/dev/null
            rm -f "$tmp"
          }

          check_page "https://chilllabo.tokyo/" "ひと口ずつ"
          check_page "https://chilllabo.tokyo/en/" "One sip at a time"
          check_page "https://chilllabo.tokyo/story/" "好きな一本を"
          check_page "https://chilllabo.tokyo/guide/sake-karakuchi/" "日本酒の「辛口」"

          sitemap="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors https://chilllabo.tokyo/sitemap.xml)"
          printf '%s' "$sitemap" | grep -F '<loc>https://chilllabo.tokyo/story/</loc>' >/dev/null
          printf '%s' "$sitemap" | grep -F '<loc>https://chilllabo.tokyo/guide/sake-karakuchi/</loc>' >/dev/null
